<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
  /* ── 디자인 토큰 (따뜻한 카페 톤) ───────────────────────── */
  :root {
    --bg: #f4eee5;
    --surface: #ffffff;
    --surface-2: #faf5ee;
    --line: #e7dcca;
    --text: #2e2621;
    --muted: #8c7b6a;
    --brand: #6b4a32;       /* 에스프레소 */
    --brand-ink: #ffffff;
    --brand-soft: #efe3d5;
    --accent: #c08552;      /* 카라멜 */
    --ok: #4e7c59;
    --ok-soft: #e4efe4;
    --warn: #b1802f;
    --warn-soft: #f5ead2;
    --danger: #b24c38;
    --danger-soft: #f6e0d9;
    --radius: 16px;
    --radius-lg: 22px;
    --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(60,40,25,.06), 0 12px 30px rgba(60,40,25,.08);
    --shadow-up: 0 -6px 20px rgba(60,40,25,.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
      "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }
  a { color: inherit; text-decoration: none; }
  h2, h3 { color: var(--text); }

  .btn {
    appearance: none;
    border: 1px solid var(--brand);
    background: var(--brand);
    color: var(--brand-ink);
    font: inherit;
    font-weight: 700;
    padding: 11px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: filter .15s, transform .05s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-ghost {
    background: transparent;
    color: var(--brand);
    border-color: var(--line);
  }

  /* ── 로그인 ── */
  .login-view { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card {
    width: 100%; max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 36px 30px;
    text-align: center;
  }
  .login-title { font-size: 21px; margin: 0 0 6px; color: var(--brand); line-height: 1.35; }
  .login-sub { margin: 0 0 26px; color: var(--muted); font-size: 13px; }
  .google-btn-wrap { display: flex; justify-content: center; min-height: 44px; }
  .dev-login { margin-top: 22px; padding-top: 22px; border-top: 1px dashed var(--line); }
  .dev-label { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .dev-btns { display: flex; gap: 8px; justify-content: center; }
  .dev-btns .btn { flex: 1; padding: 11px 8px; }
  .login-msg { margin: 16px 0 0; color: var(--danger); font-size: 13px; white-space: pre-line; min-height: 18px; }

  /* ── 상단바 ── */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 16px;
    padding: 0 18px; height: 58px;
    position: sticky; top: 0; z-index: 10;
    flex-wrap: wrap;
  }
  .brand { font-weight: 800; color: var(--brand); white-space: nowrap; letter-spacing: -.01em; }
  .tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
  .tabs a {
    padding: 8px 15px; border-radius: 999px;
    color: var(--muted); font-weight: 700; white-space: nowrap;
  }
  .tabs a.active { background: var(--brand); color: var(--brand-ink); }
  .user-box { display: flex; align-items: center; gap: 10px; }
  .user-label { font-size: 13px; color: var(--muted); white-space: nowrap; }

  /* ── 본문 공통 ── */
  .content { max-width: 860px; margin: 0 auto; padding: 24px 16px 40px; }
  .loading { color: var(--muted); padding: 40px 0; text-align: center; }
  .page-head { margin: 0 0 18px; }
  .page-head h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; }
  .page-head p { margin: 0; color: var(--muted); font-size: 13px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 16px;
  }
  .sec-title { margin: 0 0 12px; font-size: 15px; }

  .placeholder {
    text-align: center; color: var(--muted);
    padding: 48px 20px; border: 2px dashed var(--line); border-radius: var(--radius);
  }
  .placeholder .badge {
    display: inline-block; background: var(--brand); color: var(--brand-ink);
    font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 999px; margin-bottom: 12px;
  }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }

  table.mini { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  table.mini th, table.mini td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; }
  table.mini th { background: var(--surface-2); }

  .toast {
    position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: 11px 20px; border-radius: 999px;
    font-size: 13px; box-shadow: var(--shadow); z-index: 60; max-width: 90vw; text-align: center;
  }

  /* ── 입력 필드 공통 ── */
  .fld { display: flex; flex-direction: column; gap: 6px; }
  .fld-label { font-size: 12px; font-weight: 700; color: var(--muted); }
  input[type="text"], input[type="number"], input[type="datetime-local"],
  select, textarea {
    font: inherit; color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(192,133,82,.16);
  }
  input[readonly] { color: var(--muted); background: var(--surface-2); }
  textarea { resize: vertical; min-height: 40px; }

  /* ── 체크리스트 작성 페이지 ── */
  .cl-head {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  .cl-items { }
  .item-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 12px;
  }
  .item-card.has-x { border-left: 4px solid var(--danger); }
  .item-top { display: flex; gap: 12px; align-items: flex-start; }
  .item-no {
    flex-shrink: 0;
    width: 28px; height: 28px; border-radius: 999px;
    background: var(--brand-soft); color: var(--brand);
    font-weight: 800; font-size: 13px;
    display: grid; place-items: center;
  }
  .item-name { flex: 1; min-width: 0; }
  .item-name strong { display: block; font-size: 14px; line-height: 1.4; }
  .item-name .item-desc { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .item-max { flex-shrink: 0; color: var(--muted); font-size: 12px; font-weight: 700; white-space: nowrap; }

  .item-score {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin: 12px 0 10px;
  }
  .item-range { flex: 1; min-width: 150px; accent-color: var(--brand); }
  input.item-num { width: 76px; flex: 0 0 auto; text-align: center; font-weight: 700; padding: 8px 6px; }
  .item-x {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; cursor: pointer;
  }
  .item-x input { width: 16px; height: 16px; accent-color: var(--danger); }
  .item-card textarea { margin-top: 8px; font-size: 13px; min-height: 38px; }

  /* 사진 */
  .photo-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .photo-add {
    border: 1.5px dashed var(--line); border-radius: var(--radius-sm);
    padding: 10px 16px; font-size: 13px; font-weight: 700; color: var(--brand);
    cursor: pointer; background: var(--surface-2);
  }
  .photo-add:hover { border-color: var(--accent); }
  .photo-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .photo-thumb { position: relative; width: 96px; height: 96px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--line); }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-thumb .p-kind {
    position: absolute; left: 4px; top: 4px; background: rgba(46,38,33,.8); color: #fff;
    font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px;
  }
  .photo-thumb .p-del {
    position: absolute; right: 4px; top: 4px; width: 20px; height: 20px; border-radius: 999px;
    border: none; background: rgba(46,38,33,.8); color: #fff; font-size: 12px; cursor: pointer;
    display: grid; place-items: center; line-height: 1;
  }

  /* 90점 미만 안내 */
  .cl-actions { background: var(--danger-soft); border-color: var(--danger); }
  .cl-actions .sec-title { color: var(--danger); }
  .cl-actions ol { margin: 0; padding-left: 20px; font-size: 13px; }
  .cl-actions li { margin: 4px 0; }

  /* 하단 고정 요약 바 */
  .cl-summary {
    position: sticky; bottom: 0; z-index: 20;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius) var(--radius) 0 0;
    box-shadow: var(--shadow-up);
    padding: 14px 18px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    margin: 8px -16px 0;
  }
  .cl-sum-score { font-weight: 800; font-size: 15px; color: var(--muted); }
  .cl-sum-score #clTotal { font-size: 26px; color: var(--brand); }
  .cl-sum-mid { display: flex; align-items: center; gap: 8px; flex: 1; }
  .grade-badge {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 800;
    background: var(--surface-2); color: var(--muted);
  }
  .grade-badge.g-ok { background: var(--ok-soft); color: var(--ok); }
  .grade-badge.g-warn { background: var(--warn-soft); color: var(--warn); }
  .grade-badge.g-danger { background: var(--danger-soft); color: var(--danger); }
  .recheck-badge {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 800; background: var(--danger); color: #fff;
  }
  .cl-sum-btns { display: flex; gap: 8px; }

  /* ── 대시보드 (Phase 3) ── */
  .dash-filter { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; align-items: end; }
  .dash-filter-btns { grid-column: 1 / -1; display: flex; gap: 8px; }
  .dash-filter input[type="date"] { padding: 9px 10px; }

  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .tile {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px;
  }
  .tile .t-label { font-size: 12px; color: var(--muted); font-weight: 700; }
  .tile .t-value { font-size: 24px; font-weight: 800; color: var(--brand); margin-top: 4px; }
  .tile.warn .t-value { color: var(--warn); }
  .tile.danger .t-value { color: var(--danger); }

  .warn-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .warn-col h4 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .warn-n {
    background: var(--brand-soft); color: var(--brand); font-size: 11px;
    font-weight: 800; border-radius: 999px; padding: 1px 7px;
  }
  .warn-none { color: var(--muted); font-size: 12px; }
  .chip {
    display: inline-block; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; margin: 0 6px 6px 0;
  }
  .chip.d { border-color: var(--danger); color: var(--danger); }

  .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .store-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px;
  }
  .store-card .sc-name { font-weight: 700; font-size: 13px; }
  .store-card .sc-score { font-size: 26px; font-weight: 800; color: var(--brand); line-height: 1.2; }
  .store-card .sc-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; display: inline-block; width: 90px; vertical-align: middle; }
  .bar > span { display: block; height: 100%; background: var(--brand); }
  .bar.low > span { background: var(--danger); }
  .bar.mid > span { background: var(--warn); }
  .bar-cap { font-size: 11px; color: var(--muted); margin-left: 6px; }

  .link-btn {
    background: none; border: none; color: var(--brand); font: inherit; font-weight: 700;
    cursor: pointer; text-decoration: underline; padding: 0;
  }
  table.mini tr.row-x td { background: var(--danger-soft); }

  .modal { position: fixed; inset: 0; background: rgba(46,38,33,.45); display: grid; place-items: center; z-index: 80; padding: 20px; }
  .modal-box {
    background: var(--surface); border-radius: var(--radius-lg);
    max-width: 660px; width: 100%; max-height: 88vh; overflow: auto;
    padding: 22px; box-shadow: var(--shadow);
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-head .btn { padding: 7px 14px; }
  .dm-head h3 { margin: 0 0 8px; }
  .dm-photos { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .dm-photos figure { margin: 0; width: 160px; }
  .dm-photos img { width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--line); }
  .dm-photos figcaption { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }

  @media print {
    body * { visibility: hidden; }
    .modal, .modal * { visibility: visible; }
    .modal { position: absolute; inset: 0; background: #fff; padding: 0; display: block; }
    .modal-box { box-shadow: none; max-height: none; max-width: none; }
    .no-print { display: none !important; }
  }

  @media (max-width: 640px) {
    .topbar { height: auto; padding: 8px 14px; }
    .brand { width: 100%; }
    .user-box { width: 100%; justify-content: space-between; }
    .content { padding: 18px 14px 32px; }
    .cl-head { grid-template-columns: 1fr; }
    .cl-summary { margin: 8px -14px 0; padding: 12px 14px; }
    .cl-sum-btns { width: 100%; }
    .cl-sum-btns .btn { flex: 1; }
    .dash-filter { grid-template-columns: 1fr 1fr; }
    .tiles { grid-template-columns: 1fr 1fr; }
    .warn-cols { grid-template-columns: 1fr; }
  }
</style>

</head>
<body>
  <!-- 로그인 화면 -->
  <section id="loginView" class="login-view">
    <div class="login-card">
      <h1 class="login-title">만평대리점<br>매장 점검 체크리스트</h1>
      <p class="login-sub">그룹장 · 총괄 · 대표 전용</p>

      <div id="googleBtnWrap" class="google-btn-wrap" hidden></div>

      <div id="devLoginWrap" class="dev-login" hidden>
        <p class="dev-label">개발용 임시 로그인</p>
        <div class="dev-btns">
          <button class="btn" data-role="그룹장">그룹장</button>
          <button class="btn" data-role="총괄">총괄</button>
          <button class="btn" data-role="대표">대표</button>
        </div>
      </div>

      <p id="loginMsg" class="login-msg" role="alert"></p>
    </div>
  </section>

  <!-- 앱 본체 -->
  <div id="appView" class="app-view" hidden>
    <header class="topbar">
      <div class="brand">만평대리점 점검</div>
      <nav class="tabs">
        <a href="#/checklist" data-tab="checklist">체크리스트 작성</a>
        <a href="#/dashboard" data-tab="dashboard">결과 대시보드</a>
        <a href="#/stores" data-tab="stores">매장별 관리</a>
      </nav>
      <div class="user-box">
        <span id="userLabel" class="user-label"></span>
        <button id="logoutBtn" class="btn btn-ghost">로그아웃</button>
      </div>
    </header>

    <main id="content" class="content">
      <div class="loading">불러오는 중…</div>
    </main>

    <div id="pageTemplates" hidden>
      <template id="tpl-checklist">
  <form id="clForm" class="cl" autocomplete="off">
    <div class="page-head">
      <h2>체크리스트 작성</h2>
      <p>매장을 방문해 10개 항목을 점검하고 총점·판정을 기록합니다.</p>
    </div>

    <div class="card cl-head">
      <label class="fld">
        <span class="fld-label">매장</span>
        <select id="clStore" required>
          <option value="">매장 선택…</option>
        </select>
      </label>
      <label class="fld">
        <span class="fld-label">점검일시</span>
        <input type="datetime-local" id="clDate" required>
      </label>
      <label class="fld">
        <span class="fld-label">점검자</span>
        <input type="text" id="clInspector" readonly>
      </label>
      <label class="fld">
        <span class="fld-label">점검 구분</span>
        <select id="clRound">
          <option value="0">최초 점검</option>
          <option value="1">재점검 1회차</option>
          <option value="2">재점검 2회차</option>
        </select>
      </label>
    </div>

    <div id="clItems" class="cl-items"></div>

    <div class="card">
      <h3 class="sec-title">개선 사진 (선택)</h3>
      <div class="photo-row">
        <label class="photo-add">
          <input type="file" class="cl-photo" data-kind="전" accept="image/*" hidden>
          전(前) 사진 추가
        </label>
        <label class="photo-add">
          <input type="file" class="cl-photo" data-kind="후" accept="image/*" hidden>
          후(後) 사진 추가
        </label>
      </div>
      <div id="clPhotoPreview" class="photo-preview"></div>
    </div>

    <div id="clActions" class="card cl-actions" hidden>
      <h3 class="sec-title">90점 미만 — 후속 조치</h3>
      <ol id="clActionList"></ol>
    </div>

    <div class="cl-summary">
      <div class="cl-sum-score"><span id="clTotal">0</span><span> / 100점</span></div>
      <div class="cl-sum-mid">
        <span id="clGrade" class="grade-badge">—</span>
        <span id="clRecheck" class="recheck-badge" hidden>재점검 필요</span>
      </div>
      <div class="cl-sum-btns">
        <button type="button" id="clSaveDraft" class="btn btn-ghost">임시저장</button>
        <button type="submit" id="clSubmit" class="btn">제출</button>
      </div>
    </div>
  </form>
</template>

      <template id="tpl-dashboard">
  <div class="page-head">
    <h2>결과 대시보드</h2>
    <p id="dashScope">—</p>
  </div>

  <div class="card dash-filter">
    <label class="fld"><span class="fld-label">시작일</span><input type="date" id="dfFrom"></label>
    <label class="fld"><span class="fld-label">종료일</span><input type="date" id="dfTo"></label>
    <label class="fld"><span class="fld-label">매장</span>
      <select id="dfStore"><option value="">전체</option></select>
    </label>
    <label class="fld"><span class="fld-label">판정</span>
      <select id="dfGrade"><option value="">전체</option></select>
    </label>
    <label class="fld"><span class="fld-label">상태</span>
      <select id="dfStatus">
        <option value="">전체</option>
        <option value="제출">제출</option>
        <option value="임시저장">임시저장</option>
      </select>
    </label>
    <div class="dash-filter-btns">
      <button type="button" id="dfApply" class="btn">조회</button>
      <button type="button" id="dfReset" class="btn btn-ghost">초기화</button>
    </div>
  </div>

  <div id="dashBody"><div class="loading">불러오는 중…</div></div>

  <div id="dashModal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head no-print">
        <strong>점검 상세</strong>
        <span>
          <button type="button" id="dmPrint" class="btn btn-ghost">인쇄 / PDF</button>
          <button type="button" id="dmClose" class="btn btn-ghost">닫기</button>
        </span>
      </div>
      <div id="dmBody"></div>
    </div>
  </div>
</template>

      <template id="tpl-stores">
  <div class="page-head">

  ].map(function (r) { return { store_id: r[0], name: r[1], team: r[2], leader: r[3], head: '신동훈' }; });

  var ITEMS = [
    ['Q1',1,20,true,'고객 상담석의 청결 및 정리정돈 상태','오염정도, 개인물품 등의 정리 상태, 업무용 기기 및 책자·팜플렛 정리 상태 등'],

  var GRADE_RULES = [
    { min: 95, grade: '우수', recheck: false },

  var ACTIONS = [
    '24시간 내 밴드 댓글로 개선 사진 제출 [전/후 사진 제출]',

  function userFor(role) {
    var team = role === '그룹장' ? '함께팀' : '전체';
    var all = (role === '총괄' || role === '대표');
    return { uid: 'DEV_' + role, name: '[개발]' + role, role: role, team: team,
      email: 'dev+' + role + '@example.com', canSeeAllStores: all };
  }

  function mkDashboard(vis, scopeLabel, filter) {
    filter = filter || {};
    var today = new Date();
    function day(off) { var x = new Date(today); x.setDate(x.getDate() - off); return x.toISOString().slice(0, 10); }
    var seqs = [[94,91,96],[92,90,93],[96,95,98],[88,91,90],[97,96,95],[91,93,89],[83,86,79]];
    var allIns = [];
    vis.forEach(function (s, idx) {
      (seqs[idx % seqs.length]).forEach(function (total, k) {
        var grade = total >= 95 ? '우수' : total >= 90 ? '양호' : total >= 85 ? '관리 필요' : '개선 필요';
        allIns.push({
          inspection_id: 'INS_' + s.store_id + '_' + k,
          store_id: s.store_id, store: s.name, team: s.team,
          at: day(k * 7) + ' 14:30',
          inspector: '[개발]' + (s.team === '함께팀' ? '정시영' : '정수빈'), role: '그룹장',
          total: total, grade: grade, recheck: total < 90, round: 0, under90: total < 90, status: '제출'
        });
      });
    });
    allIns.sort(function (a, b) { return a.at < b.at ? 1 : -1; });

    var storeCards = vis.map(function (s) {
      var list = allIns.filter(function (i) { return i.store_id === s.store_id; });
      var last = list[0];
      var streak = 0;
      for (var k = 0; k < list.length; k++) { if (list[k].under90) streak++; else break; }
      var avg = list.length ? Math.round(list.reduce(function (t, x) { return t + x.total; }, 0) / list.length * 10) / 10 : null;
      return {
        store_id: s.store_id, name: s.name, team: s.team, count: list.length, avg: avg,
        lastAt: last ? last.at : '', lastTotal: last ? last.total : null, lastGrade: last ? last.grade : '',
        lastRecheck: last ? last.recheck : false, lastUnder90: last ? last.under90 : false, under90Streak: streak
      };
    });
    var warnings = {
      recheck: storeCards.filter(function (c) { return c.lastRecheck; }),
      under90: storeCards.filter(function (c) { return c.lastUnder90; }),
      streak2: storeCards.filter(function (c) { return c.under90Streak >= 2; })
    };
    var fSub = allIns.slice();
    if (filter.store_id) fSub = fSub.filter(function (i) { return i.store_id === filter.store_id; });
    if (filter.grade) fSub = fSub.filter(function (i) { return i.grade === filter.grade; });
    if (filter.status) fSub = fSub.filter(function (i) { return i.status === filter.status; });
    var stat = {
      submittedCount: fSub.length,
      avgScore: fSub.length ? Math.round(fSub.reduce(function (t, x) { return t + x.total; }, 0) / fSub.length * 10) / 10 : null,
      recheckCount: warnings.recheck.length, under90Count: warnings.under90.length, streak2Count: warnings.streak2.length
    };
    var itemWeakness = ITEMS.map(function (it, idx) {
      var avg = Math.round(Math.max(0, it.max - (idx % 3 === 0 ? 2.5 : idx % 3 === 1 ? 1 : 0.3)) * 10) / 10;
      return {
        item_id: it.item_id, no: it.no, name: it.name, max: it.max,
        avg: avg, ratio: Math.round(avg / it.max * 100),
        xCount: idx % 4 === 0 ? 2 : 0, belowCount: idx % 2, n: fSub.length
      };
    }).sort(function (a, b) { return a.ratio - b.ratio; });

    return {
      scope: scopeLabel, stores: vis, grades: ['우수', '양호', '관리 필요', '개선 필요'],
      stat: stat, warnings: warnings, storeCards: storeCards, itemWeakness: itemWeakness,
      recent: fSub.slice(0, 100)
    };
  }

  var API = {
    getAuthConfig: function () { return { devMode: true, googleClientId: '', ready: true }; },
    devLogin: function (role) {
      if (['그룹장','총괄','대표'].indexOf(role) < 0) throw new Error('알 수 없는 역할: ' + role);
      return { token: 'mock.' + role, user: userFor(role) };
    },
    login: function () { throw new Error('미리보기에서는 Google 로그인을 쓸 수 없습니다.'); },
    getBootstrap: function (token) {
      var role = String(token).split('.')[1] || '그룹장';
      var u = userFor(role);
      var stores = u.canSeeAllStores ? STORES : STORES.filter(function (s) { return s.team === u.team; });
      return {
        user: u, stores: stores, items: ITEMS, gradeRules: GRADE_RULES,
        under90Actions: ACTIONS, maxTotal: 100, criticalXThreshold: 2,
        serverTime: new Date().toISOString().slice(0, 19)
      };
    },
    getDashboard: function (token, filter) {
      var role = String(token).split('.')[1] || '그룹장';
      var u = userFor(role);
      var vis = u.canSeeAllStores ? STORES : STORES.filter(function (s) { return s.team === u.team; });
      return mkDashboard(vis, u.canSeeAllStores ? '전체 매장' : u.team, filter || {});
    },
    getInspectionDetail: function (token, id) {
      var parts = String(id).split('_');
      var storeId = parts[1], k = Number(parts[2]) || 0;
      var s = STORES.filter(function (x) { return x.store_id === storeId; })[0] || STORES[0];
      var totals = [94, 91, 96, 88, 92, 90];
      var total = totals[k % totals.length] || 88;
      var grade = total >= 95 ? '우수' : total >= 90 ? '양호' : total >= 85 ? '관리 필요' : '개선 필요';
      var scores = ITEMS.map(function (it, idx) {
        var sc = Math.max(0, it.max - (idx === 0 ? 4 : idx === 2 ? 2 : 0));
        return {
          item_id: it.item_id, no: it.no, name: it.name, max: it.max, score: sc,
          isX: idx === 2, reason: idx === 0 ? '개인물품 정리 미흡' : '', note: ''
        };
      });
      return {
        inspection: {
          inspection_id: id, store: s.name, store_id: storeId,
          at: new Date().toISOString().slice(0, 10) + ' 14:30', inspector: '[개발]점검자', role: '그룹장',
          total: total, grade: grade, recheck: total < 90, round: 0, under90: total < 90,
          status: '제출', createdAt: new Date().toISOString().slice(0, 16).replace('T', ' ')
        },
        scores: scores, photos: [], under90Actions: total < 90 ? ACTIONS.slice() : []
      };
    },
    saveInspection: function (token, payload) {
      var ev = API.previewEvaluation(token, (payload && payload.entries) || []);
      return {
        inspection_id: 'INS_mock_' + Date.now(),
        status: payload && payload.status === '제출' ? '제출' : '임시저장',
        total: ev.total, grade: ev.grade, needRecheck: ev.needRecheck,
        under90: ev.under90, criticalXCount: ev.criticalXCount, actions: ev.actions,
        photos: ((payload && payload.photos) || []).map(function (p) {
          return { ok: true, kind: p.kind, url: '#mock' };
        })
      };
    },
    previewEvaluation: function (token, entries) {
      var map = {}; ITEMS.forEach(function (i) { map[i.item_id] = i; });
      var total = 0, cx = 0, breakdown = [];
      (entries || []).forEach(function (e) {
        var it = map[e.item_id]; if (!it) return;
        var s = Math.max(0, Math.min(Number(e.score) || 0, it.max));
        total += s;
        var isX = e.isX === true;
        if (isX && it.critical) cx++;
        breakdown.push({ item_id: it.id, no: it.no, name: it.name, max: it.max, score: s, isX: isX, critical: it.critical });
      });
      total = Math.round(total * 10) / 10;
      var rule = GRADE_RULES.filter(function (r) { return total >= r.min; })[0];
      return {
        total: total, grade: rule.grade,
        needRecheck: rule.recheck || cx >= 2, under90: total < 90,
        criticalXCount: cx, actions: total < 90 ? ACTIONS.slice() : [], breakdown: breakdown
      };
    }
  };

  function makeRunner() {
    var ok = null, fail = null;
    var runner = {
      withSuccessHandler: function (fn) { ok = fn; return runner; },
      withFailureHandler: function (fn) { fail = fn; return runner; }
    };
    Object.keys(API).forEach(function (name) {
      runner[name] = function () {
        var args = arguments;
        setTimeout(function () {
          try { var r = API[name].apply(null, args); ok && ok(r); }
          catch (e) { fail && fail(e); }
        }, 100);
      };
    });
    return runner;
  }

  window.google = window.google || {};
  window.google.script = {};
  Object.defineProperty(window.google.script, 'run', { get: makeRunner });
})();
</script>

  <script>
/* ────────────────────────────────────────────────────────────
 *  체크리스트 작성 페이지 (Phase 2)

(function () {
  'use strict';

  var PHOTO_MAX_DIM = 1600;
  var PHOTO_QUALITY = 0.8;

  // route() 가 이 이름을 호출한다.
  window.initChecklistPage = function (MP) {
    if (!MP || !MP.boot) return;
    var boot = MP.boot, user = MP.user;

    var form = document.getElementById('clForm');

    var elStore = document.getElementById('clStore');

    var elRound = document.getElementById('clRound');
    var elItems = document.getElementById('clItems');
    var elTotal = document.getElementById('clTotal');

    var elRecheck = document.getElementById('clRecheck');
    var elActions = document.getElementById('clActions');
    var elActionList = document.getElementById('clActionList');
    var elPhotoPreview = document.getElementById('clPhotoPreview');
    var btnDraft = document.getElementById('clSaveDraft');
    var btnSubmit = document.getElementById('clSubmit');

    var photos = [];   // { kind, dataUrl, name }
    var busy = false;

    /* 매장 옵션 */
    boot.stores.forEach(function (s) {
      var o = document.createElement('option');
      o.value = s.store_id;

    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());

    elInspector.value = user.name + ' · ' + user.role;

    /* 항목 카드 생성 */
    boot.items.forEach(function (it) {
      elItems.appendChild(buildItemCard(it));
    });

    elItems.addEventListener('input', onItemInput);
    elItems.addEventListener('change', onItemInput);
    form.addEventListener('submit', function (e) { e.preventDefault(); save('제출'); });
    btnDraft.addEventListener('click', function () { save('임시저장'); });

    form.querySelectorAll('.cl-photo').forEach(function (inp) {
      inp.addEventListener('change', function () { onPickPhoto(inp); });
    });

    recompute();

    /* ── 항목 카드 ──────────────────────────────────────── */
    function buildItemCard(it) {
      var card = document.createElement('div');
      card.className = 'item-card';
      card.dataset.item = it.item_id;
      card.dataset.max = it.max;
      card.innerHTML =
        '<div class="item-top">' +
          '<span class="item-no">' + it.no + '</span>' +
          '<span class="item-name"><strong>' + esc(it.name) + '</strong>' +
            (it.desc ? '<span class="item-desc">' + esc(it.desc) + '</span>' : '') +
          '</span>' +
          '<span class="item-max">/ ' + it.max + '점</span>' +
        '</div>' +
        '<div class="item-score">' +
          '<input type="range" class="item-range" min="0" max="' + it.max + '" step="1" value="' + it.max + '">' +
          '<input type="number" class="item-num" min="0" max="' + it.max + '" step="1" value="' + it.max + '">' +
          '<label class="item-x"><input type="checkbox" class="item-xbox"> 중요결함 X</label>' +
        '</div>' +
        '<textarea class="item-reason" rows="1" placeholder="사유 (감점 시 입력)"></textarea>' +
        '<textarea class="item-note" rows="1" placeholder="기타 특이점"></textarea>';
      return card;
    }

    function onItemInput(e) {
      var t = e.target;
      var card = t.closest('.item-card');
      if (!card) return;
      var max = Number(card.dataset.max);

      if (t.classList.contains('item-range')) {
        card.querySelector('.item-num').value = t.value;
      } else if (t.classList.contains('item-num')) {
        var v = clamp(parseInt(t.value, 10) || 0, 0, max);
        t.value = v;
        card.querySelector('.item-range').value = v;
      } else if (t.classList.contains('item-xbox')) {
        card.classList.toggle('has-x', t.checked);
      }
      recompute();
    }

    /* ── 실시간 판정 ────────────────────────────────────── */
    function collectEntries() {
      return Array.prototype.map.call(elItems.querySelectorAll('.item-card'), function (card) {
        return {
          item_id: card.dataset.item,
          score: Number(card.querySelector('.item-num').value) || 0,
          isX: card.querySelector('.item-xbox').checked,
          reason: card.querySelector('.item-reason').value.trim(),
          note: card.querySelector('.item-note').value.trim()
        };
      });
    }

    function recompute() {
      var ev = evaluate(boot.items, collectEntries(), boot.gradeRules, boot.criticalXThreshold);
      elTotal.textContent = ev.total;
      elGrade.textContent = ev.grade;
      elGrade.className = 'grade-badge ' + gradeClass(ev.grade);
      elRecheck.hidden = !ev.needRecheck;

      if (ev.under90) {
        elActionList.innerHTML = boot.under90Actions.map(function (a) {
          return '<li>' + esc(a) + '</li>';
        }).join('');
        elActions.hidden = false;
      } else {
        elActions.hidden = true;
      }
    }

    /* ── 사진 ──────────────────────────────────────────── */
    function onPickPhoto(inp) {
      var file = inp.files && inp.files[0];
      inp.value = '';
      if (!file) return;
      if (!/^image\//.test(file.type)) { MP.toast('이미지 파일만 첨부할 수 있습니다.'); return; }
      downscale(file, PHOTO_MAX_DIM, PHOTO_QUALITY).then(function (dataUrl) {
        photos.push({ kind: inp.dataset.kind, dataUrl: dataUrl, name: file.name });
        renderPhotos();
      }).catch(function () { MP.toast('사진을 불러오지 못했습니다.'); });
    }

    function renderPhotos() {
      elPhotoPreview.innerHTML = '';
      photos.forEach(function (p, i) {
        var d = document.createElement('div');
        d.className = 'photo-thumb';
        d.innerHTML =
          '<img src="' + p.dataUrl + '" alt="">' +
          '<span class="p-kind">' + p.kind + '</span>' +
          '<button type="button" class="p-del" aria-label="삭제">×</button>';
        d.querySelector('.p-del').addEventListener('click', function () {
          photos.splice(i, 1); renderPhotos();
        });
        elPhotoPreview.appendChild(d);
      });
    }

    /* ── 저장 ──────────────────────────────────────────── */
    function save(status) {
      if (busy) return;
      if (!elStore.value) { MP.toast('매장을 선택하세요.'); elStore.focus(); return; }
      if (!elDate.value) { MP.toast('점검일시를 입력하세요.'); elDate.focus(); return; }

      var entries = collectEntries();
      if (status === '제출') {
        var ev = evaluate(boot.items, entries, boot.gradeRules, boot.criticalXThreshold);
        var msg = '제출하시겠습니까?\n\n총점 ' + ev.total + '점 · ' + ev.grade +
          (ev.needRecheck ? '\n재점검 필요' : '');
        if (!window.confirm(msg)) return;
      }

      var payload = {
        store_id: elStore.value,
        inspectedAt: elDate.value,
        recheckRound: Number(elRound.value) || 0,
        status: status,
        entries: entries,
        photos: photos.map(function (p) {
          return { kind: p.kind, dataBase64: p.dataUrl, mimeType: 'image/jpeg', filename: p.name };
        })
      };

      setBusy(true);
      MP.gs('saveInspection', MP.token, payload)
        .then(function (res) {
          setBusy(false);
          var failed = (res.photos || []).filter(function (x) { return !x.ok; }).length;
          MP.toast(
            (res.status === '제출' ? '제출 완료' : '임시저장 완료') +
            ' · 총점 ' + res.total + '점 · ' + res.grade +
            (failed ? ' (사진 ' + failed + '장 실패)' : '')
          );
          if (res.status === '제출') location.hash = '#/dashboard';
        })
        .catch(function (e) {
          setBusy(false);
          MP.toast('저장 실패: ' + (e && e.message ? e.message : e));
        });
    }

    function setBusy(b) {
      busy = b;
      btnDraft.disabled = b;
      btnSubmit.disabled = b;
      btnSubmit.textContent = b ? '저장 중…' : '제출';
    }
  };

  /* ── 순수 함수 ──────────────────────────────────────── */

  function evaluate(items, entries, gradeRules, xThreshold) {
    var map = {};
    items.forEach(function (i) { map[i.item_id] = i; });
    var total = 0, cx = 0;
    entries.forEach(function (e) {
      var it = map[e.item_id];
      if (!it) return;
      var s = clamp(Number(e.score) || 0, 0, it.max);
      total += s;
      if (e.isX && it.critical) cx++;
    });
    total = Math.round(total * 10) / 10;
    var rule = gradeRules.filter(function (r) { return total >= r.min; })[0] || gradeRules[gradeRules.length - 1];
    return {
      total: total,
      grade: rule.grade,
      needRecheck: rule.recheck || cx >= xThreshold,
      under90: total < 90,
      criticalXCount: cx
    };
  }

  function gradeClass(grade) {
    if (grade === '우수' || grade === '양호') return 'g-ok';
    if (grade === '관리 필요') return 'g-warn';
    return 'g-danger';
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function downscale(file, maxDim, quality) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var c = document.createElement('canvas');
        c.width = cw; c.height = ch;
        c.getContext('2d').drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        try { resolve(c.toDataURL('image/jpeg', quality)); }
        catch (e) { reject(e); }
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('image load error')); };
      img.src = url;
    });
  }
})();
</script>

  <script>
/* ────────────────────────────────────────────────────────────
 *  결과 대시보드 (Phase 3)

(function () {
  'use strict';

  window.initDashboardPage = function (MP) {
    if (!MP || !MP.boot) return;
    var root = document.getElementById('dashBody');
    if (!root) return;

    var elScope = document.getElementById('dashScope');
    var dfFrom = document.getElementById('dfFrom');
    var dfTo = document.getElementById('dfTo');

    var dfGrade = document.getElementById('dfGrade');

    /* 필터 옵션 */

      dfStore.appendChild(opt(s.store_id, s.name));
    });
    MP.boot.gradeRules.forEach(function (r) {
      dfGrade.appendChild(opt(r.grade, r.grade));
    });

    document.getElementById('dfApply').addEventListener('click', load);
    document.getElementById('dfReset').addEventListener('click', function () {
      dfFrom.value = dfTo.value = dfStore.value = dfGrade.value = dfStatus.value = '';
      load();

    document.getElementById('dmClose').addEventListener('click', closeModal);
    document.getElementById('dmPrint').addEventListener('click', function () { window.print(); });
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

    load();

    function load() {
      root.innerHTML = '<div class="loading">불러오는 중…</div>';

    function render(d) {

      var st = d.stat;

        '<div class="tiles">' +
          tile('제출 건수', st.submittedCount, '') +

        '</div></div>';

      var cards = '<div class="card"><h3 class="sec-title">매장별 현재 상태</h3><div class="store-grid">' +
        d.storeCards.map(storeCard).join('') + '</div></div>';

      var weak = '<div class="card"><h3 class="sec-title">항목별 취약점 (감점 많은 순)</h3>' +
        '<table class="mini"><thead><tr><th>#</th><th>항목</th><th>평균</th><th>달성률</th><th>X</th><th>감점 건수</th></tr></thead><tbody>' +
        d.itemWeakness.map(function (w) {
          var r = w.ratio;
          var cls = r == null ? '' : (r < 70 ? 'low' : (r < 90 ? 'mid' : ''));
          return '<tr><td>' + w.no + '</td><td>' + esc(w.name) + '</td>' +
            '<td>' + (w.avg == null ? '—' : w.avg + ' / ' + w.max) + '</td>' +
            '<td style="min-width:120px">' + (r == null ? '—' :
              '<div class="bar ' + cls + '"><span style="width:' + r + '%"></span></div>' +
              '<span class="bar-cap">' + r + '%</span>') + '</td>' +
            '<td>' + w.xCount + '</td><td>' + w.belowCount + ' / ' + w.n + '</td></tr>';
        }).join('') +
        '</tbody></table></div>';

      var recent = '<div class="card"><h3 class="sec-title">최근 점검 (' + d.recent.length + '건)</h3>' +
        '<table class="mini"><thead><tr><th>점검일시</th><th>매장</th><th>점검자</th><th>총점</th><th>판정</th><th>상태</th><th></th></tr></thead><tbody>' +
        (d.recent.length ? d.recent.map(function (i) {
          return '<tr><td>' + esc(i.at) + '</td><td>' + esc(i.store) + '</td><td>' + esc(i.inspector) + '</td>' +
            '<td>' + i.total + '</td>' +
            '<td><span class="grade-badge ' + gradeClass(i.grade) + '">' + esc(i.grade || '—') + '</span>' +
              (i.recheck ? ' <span class="recheck-badge">재</span>' : '') + '</td>' +
            '<td>' + esc(i.status) + '</td>' +
            '<td><button type="button" class="link-btn" data-id="' + esc(i.inspection_id) + '">상세</button></td></tr>';

      Array.prototype.forEach.call(root.querySelectorAll('.link-btn[data-id]'), function (b) {
        b.addEventListener('click', function () { openDetail(b.dataset.id); });

    }

    /* ── 상세 모달 ──────────────────────────────────────── */
    function openDetail(id) {
      dmBody.innerHTML = '<div class="loading">불러오는 중…</div>';
      modal.hidden = false;
      MP.gs('getInspectionDetail', MP.token, id)
        .then(function (d) {
          var i = d.inspection;
          var rows = d.scores.map(function (s) {
            return '<tr' + (s.isX ? ' class="row-x"' : '') + '><td>' + s.no + '</td><td>' + esc(s.name) +
              '</td><td>' + s.score + ' / ' + s.max + '</td><td>' + (s.isX ? 'X' : '') + '</td>' +
              '<td>' + esc(s.reason) + '</td><td>' + esc(s.note) + '</td></tr>';
          }).join('');
          var photos = d.photos.length
            ? '<div class="dm-photos">' + d.photos.map(function (p) {
                return '<figure><img src="' + esc(p.url) + '" alt=""><figcaption>' + esc(p.kind) + '</figcaption></figure>';
              }).join('') + '</div>'
            : '';
          var actions = d.under90Actions.length
            ? '<div class="cl-actions" style="margin-top:12px"><h3 class="sec-title">90점 미만 — 후속 조치</h3><ol>' +
              d.under90Actions.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ol></div>'
            : '';
          dmBody.innerHTML =
            '<div class="dm-head">' +
              '<h3>' + esc(i.store) + '</h3>' +
              '<dl class="kv">' +
                kv('점검일시', i.at) + kv('점검자', i.inspector + ' · ' + i.role) +
                kv('점검 구분', i.round ? ('재점검 ' + i.round + '회차') : '최초 점검') +
                kv('상태', i.status) +
                kv('총점', '<b>' + i.total + '</b> / 100 &nbsp; <span class="grade-badge ' + gradeClass(i.grade) + '">' + esc(i.grade) + '</span>' + (i.recheck ? ' <span class="recheck-badge">재점검 필요</span>' : '')) +
              '</dl>' +
            '</div>' +
            '<table class="mini"><thead><tr><th>#</th><th>항목</th><th>점수</th><th>X</th><th>사유</th><th>기타 특이점</th></tr></thead><tbody>' +
            rows + '</tbody></table>' + actions + photos;
        })
        .catch(function (e) {
          dmBody.innerHTML = '<div>불러오지 못했습니다: ' + esc(errText(e)) + '</div>';
        });
    }

    function closeModal() { modal.hidden = true; dmBody.innerHTML = ''; }

    /* ── 조각 ───────────────────────────────────────────── */
    function tile(label, value, cls) {
      return '<div class="tile ' + (cls || '') + '"><div class="t-label">' + label +
        '</div><div class="t-value">' + value + '</div></div>';
    }
    function warnCol(title, list, chipCls) {
      return '<div class="warn-col"><h4>' + title + ' <span class="warn-n">' + list.length + '</span></h4>' +
        (list.length
          ? list.map(function (c) {
              return '<span class="chip ' + (chipCls || '') + '">' + esc(c.name) +
                (c.lastTotal != null ? ' · ' + c.lastTotal + '점' : '') +
                (title.indexOf('연속') > -1 ? ' · ' + c.under90Streak + '회' : '') + '</span>';
            }).join('')
          : '<span class="warn-none">없음</span>') +
        '</div>';
    }
    function storeCard(c) {
      var g = gradeClass(c.lastGrade);
      return '<div class="store-card">' +
        '<div class="sc-name">' + esc(c.name) + '</div>' +
        '<div class="sc-score">' + (c.lastTotal == null ? '—' : c.lastTotal) + '</div>' +
        '<div>' + (c.lastGrade ? '<span class="grade-badge ' + g + '">' + esc(c.lastGrade) + '</span>' : '') +
          (c.lastRecheck ? ' <span class="recheck-badge">재</span>' : '') + '</div>' +
        '<div class="sc-meta">' + (c.lastAt ? esc(c.lastAt) : '점검 기록 없음') +
          ' · 평균 ' + (c.avg == null ? '—' : c.avg) + ' · ' + c.count + '건' +
          (c.under90Streak >= 2 ? ' · 90미만 ' + c.under90Streak + '연속' : '') + '</div>' +
        '</div>';
    }
    function opt(v, t) { var o = document.createElement('option'); o.value = v; o.textContent = t; return o; }
    function kv(k, v) { return '<dt>' + k + '</dt><dd>' + v + '</dd>'; }
  };

  /* ── 공통 ───────────────────────────────────────────── */
  function gradeClass(grade) {
    if (grade === '우수' || grade === '양호') return 'g-ok';
    if (grade === '관리 필요') return 'g-warn';
    if (grade === '개선 필요') return 'g-danger';
    return '';
  }
  function errText(e) { return e && e.message ? e.message : String(e); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();

  <script>
/* ────────────────────────────────────────────────────────────
 *  만평대리점 체크리스트 — 클라이언트 앱 셸 (Phase 1)
 * ──────────────────────────────────────────────────────────── */
(function () {
  'use strict';

  var SESSION_KEY = 'mp_session';
  var state = { token: null, user: null, boot: null };

  /* google.script.run → Promise 래퍼 */
  function gs(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err); });
      runner[fn].apply(runner, args);
    });
  }

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }

  function saveSession(token) {
    state.token = token;
    try { sessionStorage.setItem(SESSION_KEY, token); } catch (e) {}
  }
  function loadSession() {
    try { return sessionStorage.getItem(SESSION_KEY); } catch (e) { return null; }
  }
  function clearSession() {
    state.token = null;
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
  }

  /* ── 로그인 화면 ───────────────────────────────────────── */

  function showLogin(msg) {
    $('#appView').hidden = true;
    $('#loginView').hidden = false;
    if (msg) $('#loginMsg').textContent = msg;

    var cfg = window.__BUILD__ || {};

    // 개발용 임시 로그인
    if (cfg.devMode) {
      var wrap = $('#devLoginWrap');
      wrap.hidden = false;
      $all('.dev-btns .btn', wrap).forEach(function (b) {
        b.onclick = function () {
          $('#loginMsg').textContent = '';
          gs('devLogin', b.dataset.role)
            .then(onLoggedIn)
            .catch(function (e) { $('#loginMsg').textContent = errText(e); });
        };
      });
    }

    // Google 로그인 (클라이언트 ID 있을 때만)
    if (cfg.googleClientId) {
      loadGis(cfg.googleClientId);
    } else if (!cfg.devMode) {
      $('#loginMsg').textContent =
        '로그인 수단이 설정되지 않았습니다.\n서버에 GOOGLE_CLIENT_ID 를 설정하거나 DEV_MODE 를 켜세요.';
    }
  }

  function loadGis(clientId) {
    var wrap = $('#googleBtnWrap');
    wrap.hidden = false;
    if (window.google && google.accounts && google.accounts.id) {
      renderGis(clientId);
      return;
    }
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.defer = true;
    s.onload = function () { renderGis(clientId); };
    s.onerror = function () { $('#loginMsg').textContent = 'Google 로그인 스크립트를 불러오지 못했습니다.'; };
    document.head.appendChild(s);
  }

  function renderGis(clientId) {
    google.accounts.id.initialize({
      client_id: clientId,
      callback: function (resp) {
        $('#loginMsg').textContent = '';
        gs('login', resp.credential)
          .then(onLoggedIn)
          .catch(function (e) { $('#loginMsg').textContent = errText(e); });
      }
    });
    google.accounts.id.renderButton($('#googleBtnWrap'), {
      theme: 'outline', size: 'large', text: 'signin_with', locale: 'ko'
    });
  }

  function errText(e) {
    if (!e) return '알 수 없는 오류';
    return e.message || String(e);
  }

  /* ── 로그인 성공 → 부트스트랩 ───────────────────────────── */

  function onLoggedIn(res) {
    saveSession(res.token);
    boot();
  }

  function boot() {
    var token = state.token || loadSession();
    if (!token) { showLogin(); return; }
    state.token = token;

    gs('getBootstrap', token)
      .then(function (data) {
        state.boot = data;
        state.user = data.user;
        window.MP = { boot: data, user: data.user, gs: gs, toast: toast, token: token };
        renderApp();
      })
      .catch(function (e) {
        clearSession();
        showLogin(errText(e));
      });
  }

  /* ── 앱 셸 ─────────────────────────────────────────────── */

  function renderApp() {
    $('#loginView').hidden = true;
    $('#appView').hidden = false;

    var u = state.user;
    $('#userLabel').textContent = u.name + ' · ' + u.role +
      (u.canSeeAllStores ? ' (전체)' : ' (' + u.team + ')');

    $('#logoutBtn').onclick = function () {
      clearSession();
      location.hash = '';
      location.reload();
    };

    window.addEventListener('hashchange', route);
    if (!location.hash) location.hash = '#/checklist';
    route();
  }

  var TABS = {
    'checklist': { tpl: 'tpl-checklist', init: 'initChecklistPage' },
    'dashboard': { tpl: 'tpl-dashboard', init: 'initDashboardPage' },
    'stores':    { tpl: 'tpl-stores',    init: 'initStoresPage' }
  };

  function route() {
    var key = (location.hash.replace('#/', '') || 'checklist').split('?')[0];
    if (!TABS[key]) key = 'checklist';

    $all('.tabs a').forEach(function (a) {
      a.classList.toggle('active', a.dataset.tab === key);
    });

    var content = $('#content');
    content.innerHTML = '';
    var tpl = document.getElementById(TABS[key].tpl);
    if (tpl) {
      content.appendChild(tpl.content.cloneNode(true));
    } else {
      content.innerHTML = '<div class="placeholder">페이지를 찾을 수 없습니다.</div>';
    }
    // 페이지별 초기화 훅(있으면 호출)
    var initFn = window[TABS[key].init];
    if (typeof initFn === 'function') {
      try { initFn(window.MP); } catch (e) { console.error(e); }
    }
  }

  /* ── 시작 ─────────────────────────────────────────────── */

  function start() {
    var cfg = window.__BUILD__ || {};
    // 서버가 최신 설정을 알고 있을 수 있으니 한 번 확인
    gs('getAuthConfig')
      .then(function (c) {
        window.__BUILD__ = Object.assign({}, cfg, c);
        if (loadSession()) { boot(); } else { showLogin(); }
      })
      .catch(function () {
        if (loadSession()) { boot(); } else { showLogin('서버에 연결할 수 없습니다.'); }
      });
  }

  document.addEventListener('DOMContentLoaded', start);
})();
</script>

</body>
</html>
