<template id="tpl-dashboard">
  <div class="page-head">
    <h2>결과 대시보드</h2>
    <p id="dashScope">—</p>
  </div>

  <div class="card dash-filter">
    <label class="fld"><span class="fld-label">시작일</span><input type="date" id="dfFrom"></label>
    <label class="fld"><span class="fld-label">종료일</span><input type="date" id="dfTo"></label>
    <label class="fld"><span class="fld-label">매장</span>
      <select id="dfStore"><option value="">전체</option></select>
    </label>
    <label class="fld"><span class="fld-label">판정</span>
      <select id="dfGrade"><option value="">전체</option></select>
    </label>
    <label class="fld"><span class="fld-label">상태</span>
      <select id="dfStatus">
        <option value="">전체</option>
        <option value="제출">제출</option>
        <option value="임시저장">임시저장</option>
      </select>
    </label>
    <div class="dash-filter-btns">
      <button type="button" id="dfApply" class="btn">조회</button>
      <button type="button" id="dfReset" class="btn btn-ghost">초기화</button>
    </div>
  </div>

  <div id="dashBody"><div class="loading">불러오는 중…</div></div>

  <div id="dashModal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head no-print">
        <strong>점검 상세</strong>
        <span>
          <button type="button" id="dmPrint" class="btn btn-ghost">인쇄 / PDF</button>
          <button type="button" id="dmClose" class="btn btn-ghost">닫기</button>
        </span>
      </div>
      <div id="dmBody"></div>
    </div>
  </div>
</template>
