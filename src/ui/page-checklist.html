<template id="tpl-checklist">
  <div class="page-head">
    <h2>체크리스트 작성</h2>
    <p>매장을 방문해 10개 항목을 점검하고 총점·판정을 기록합니다.</p>
  </div>

  <div class="card">
    <div class="placeholder">
      <span class="badge">Phase 2 예정</span>
      <p>이 페이지에서 구현될 기능:</p>
      <table class="mini" id="checklistPlanTable">
        <thead><tr><th>구분</th><th>내용</th></tr></thead>
        <tbody>
          <tr><td>헤더</td><td>매장 선택 · 점검일시(자동) · 점검자(로그인 사용자)</td></tr>
          <tr><td>항목 입력</td><td>10개 항목 점수 · 사유 · 기타 특이점 · 중요결함(X)</td></tr>
          <tr><td>실시간 판정</td><td>총점, 우수/양호/관리필요/개선필요, 재점검 필요 여부</td></tr>
          <tr><td>90점 미만 안내</td><td>후속 조치 3가지 자동 노출</td></tr>
          <tr><td>사진</td><td>개선 전/후 사진 업로드(Drive 저장)</td></tr>
          <tr><td>저장</td><td>임시저장 / 제출</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card" id="bootInfoCard">
    <strong>로그인/데이터 연결 확인용 정보</strong>
    <dl class="kv" id="bootInfo" style="margin-top:10px;"></dl>
  </div>
</template>
