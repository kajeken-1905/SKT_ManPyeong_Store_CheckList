<template id="tpl-stores">
  <div class="page-head">
    <h2>매장별 종합 관리</h2>
    <p>매장을 선택해 일 / 주 / 월 / 연 단위 누적 점수와 이력을 관리합니다.</p>
  </div>

  <div class="card sm-controls">
    <label class="fld sm-store-fld">
      <span class="fld-label">매장</span>
      <select id="smStore"></select>
    </label>
    <div class="sm-tabs" role="tablist">
      <button type="button" class="sm-tab is-active" data-period="day">일</button>
      <button type="button" class="sm-tab" data-period="week">주</button>
      <button type="button" class="sm-tab" data-period="month">월</button>
      <button type="button" class="sm-tab" data-period="year">연</button>
    </div>
    <div class="sm-export no-print">
      <button type="button" id="smCsv" class="btn btn-ghost">엑셀(CSV)</button>
      <button type="button" id="smPrint" class="btn btn-ghost">인쇄 / PDF</button>
    </div>
  </div>

  <div id="smBody"><div class="loading">불러오는 중…</div></div>

  <div id="smModal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head no-print">
        <strong>점검 상세</strong>
        <span>
          <button type="button" id="smmPrint" class="btn btn-ghost">인쇄 / PDF</button>
          <button type="button" id="smmClose" class="btn btn-ghost">닫기</button>
        </span>
      </div>
      <div id="smmBody"></div>
    </div>
  </div>
</template>
