<script>
/* 페이지별 초기화 훅.
 * - initChecklistPage: ui/checklist.html 에 정의 (Phase 2)
 * - initDashboardPage / initStoresPage: Phase 3~4 에서 구현
 */

function initStoresPage(MP) {
  if (!MP || !MP.boot) return;
  var tbody = document.querySelector('#storeList tbody');
  if (!tbody) return;
  tbody.innerHTML = MP.boot.stores.map(function (s) {
    return '<tr><td>' + s.store_id + '</td><td>' + s.name +
      '</td><td>' + s.team + '</td><td>' + s.leader + '</td></tr>';
  }).join('') || '<tr><td colspan="4">표시할 매장이 없습니다.</td></tr>';
}

function initDashboardPage(MP) {
  /* Phase 3 에서 구현 */
}
</script>
